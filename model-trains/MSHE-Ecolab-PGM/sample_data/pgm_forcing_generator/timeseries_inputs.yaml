# Forcing setups for the native forcing generator.
#
# One file defines any number of forcings. Each named forcing under
# `timeseries_inputs:` produces one DFS2 output from one grid-code DFS2 plus a
# set of per-grid-code time series.
#
# defaults:            inherited by every forcing that does not override it
#   grid_code_dfs2 : grid-code DFS2, absolute or relative to the MSHE-Ecolab-PGM root
#   output_dir     : folder a relative 'output_grid' is written into
#   ...any other forcing field
#
# Fields per forcing:
#   output_grid : output DFS2 (optional, default: "<forcing name>.dfs2")
#   item_name   : DFS2 item name (optional, default: the forcing name)
#   eum_type    : mikeio EUMType name
#   eum_unit    : mikeio EUMUnit name
#   inputs      : the per-grid-code time series (required)
#
# Fields per entry under `inputs`:
#   grid_code : integer grid code in the grid-code DFS2 (required)
#   path      : DFS0/CSV file, absolute or relative to the MSHE-Ecolab-PGM root (required)
#   item      : 1-based item index for multi-item DFS0 files (optional, default 1)
#   source    : "dfs0" or "csv" (optional; inferred from the file extension)
#
# Grid codes that exist in the grid-code DFS2 but are NOT listed for a forcing
# are filled with a constant value of 0 across all timesteps.
defaults:
  grid_code_dfs2: sample_data/pgm_forcing_generator/example_dfs0_dfs2/GridCode5.dfs2
  output_dir: output_data/pgm_forcing_generator/forcing_generator
  eum_type: Concentration
  eum_unit: kg_per_meter_pow_3

timeseries_inputs:
  var1:
    output_grid: Jytland-test-ouput.dfs2
    item_name: Seed Application Rate
    inputs:
      - grid_code: 1
        path: sample_data/pgm_forcing_generator/example_dfs0_dfs2/DMI_Jutland_2011-2023_item1.csv
      - grid_code: 5
        path: sample_data/pgm_forcing_generator/example_dfs0_dfs2/DMI_Jutland_2011-2023.dfs0
        item: 5

  var2:
    output_grid: Jytland-test-ouput-var2.dfs2
    item_name: Fertilizer Application Rate
    inputs:
      - grid_code: 1
        path: sample_data/pgm_forcing_generator/example_dfs0_dfs2/DMI_Jutland_2011-2023_item1.csv
      - grid_code: 5
        path: sample_data/pgm_forcing_generator/example_dfs0_dfs2/DMI_Jutland_2011-2023.dfs0
        item: 1

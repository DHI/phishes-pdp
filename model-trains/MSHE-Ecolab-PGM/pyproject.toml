[project]
name = "plant-growth-module"
version = "0.1.0"
description = "Plant Growth Module (PGM) for MIKE SHE Integration. Use 'uv sync --link-mode copy' on OneDrive."
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=1.24.0",
    "mikeio>=1.6.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.30.0",
    "ipywidgets>=8.0.0",
    "phishes-data-downloader @ git+https://github.com/DHI/phishes-pdp.git@main#subdirectory=data-download-tool",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff==0.16.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_growth_module"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.pip]
link-mode = "copy"

# Mirrors data-download-tool so both modules are linted by identical rules.
# Without this block the module inherits whatever the installed ruff ships as
# defaults, so a new ruff release changes what CI enforces with no code change.
[tool.ruff]
line-length = 100
target-version = "py310"

# Notebooks are linted (advisorily) by `nbqa ruff` in the Notebooks
# workflow, and are deliberately not auto-formatted: `ruff format` joins
# cell code up to the 100-char limit, which reads badly in a narrow cell,
# and notebook churn obscures real review diffs.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
# E501: line length is handled by the formatter, not the linter.
# I001: import sorting is left to `ruff format`.
# N999: the folder is `MSHE-Ecolab-PGM` (hyphenated to match `data-download-tool`),
#       and the stray root `__init__.py` makes ruff read that folder name as the
#       top-level module. Renaming it would undo the model-trains layout.
ignore = ["E501", "I001", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["plant_growth_module"]

[tool.coverage.run]
source = ["src/plant_growth_module"]

[tool.coverage.report]
show_missing = true
skip_covered = false

    variable: stl3
    temporal: true
    crs: EPSG:4326
    eumtype: Temperature
    eumunit: degree_Celsius
    data_value_type: Instantaneous
  era5_soil_temperature_level_4:
    path: climate/era5_soil_temperature_level_4/ERA5_soil_temperature_level_4.zarr
    display_name: ERA5 soil temperature level 4
    description: ERA5 soil temperature level 4 (100-289 cm)
    variable: stl4
    temporal: true
    crs: EPSG:4326
    eumtype: Temperature

climate:
  era5_precipitation:
    path: climate/era5_precipitation/ERA5_precipitation.zarr
    display_name: ERA5 precipitation
    description: ERA5 precipitation
    variable: tp
    temporal: true
    crs: EPSG:4326
    eumtype: Rainfall
    eumunit: millimeter
    data_value_type: StepAccumulated
  era5_temperature:
    path: climate/era5_temperature/ERA5_temperature.zarr
    display_name: ERA5 temperature
    description: ERA5 temperature
    variable: t2m
    temporal: true
    crs: EPSG:4326
    eumtype: Temperature
    eumunit: degree_Celsius
    data_value_type: Instantaneous
  era5_potential_evapotranspiration:
    path: climate/era5_potential_evapotranspiration/ERA5_potential_evapotranspiration.zarr
    display_name: ERA5 potential evapotranspiration
    description: ERA5 potential evapotranspiration
    variable: pev
    temporal: true
    crs: EPSG:4326
    eumtype: Evaporation
    eumunit: millimeter
    data_value_type: StepAccumulated
  era5_surface_solar_radiation_downwards:
    path: climate/era5_surface_solar_radiation_downwards/ERA5_surface_solar_radiation_downwards.zarr
    display_name: ERA5 surface solar radiation downwards
    description: ERA5 surface solar radiation downwards
    variable: ssrd
    temporal: true
    crs: EPSG:4326
    eumtype: Sun_radiation
    eumunit: watt_per_meter_pow_2
    data_value_type: StepAccumulated
  era5_temperature_land:
    path: climate/era5_temperature_land/ERA5_temperature_land.zarr
    display_name: ERA5-Land 2m temperature
    description: ERA5-Land 2m temperature
    variable: reanalysis_era5_land
    temporal: true
    crs: EPSG:4326
    eumtype: Temperature
    eumunit: degree_Celsius
    data_value_type: Instantaneous
  era5_wind_speed:
    path: climate/era5_wind_speed/ERA5_wind_speed.zarr
    display_name: ERA5 10m wind speed
    description: ERA5 10m wind speed
    variable: reanalysis_era5_single_levels
    temporal: true
    crs: EPSG:4326
    eumtype: Wind_speed
    eumunit: meter_per_sec
    data_value_type: Instantaneous

# Cloud Optimized GeoTIFF (COG) layers. Static rasters (no time dimension) stored
# in a separate Azure container on the same account. Distinguished by `format: cog`.
# Set `container` to the COG container name and `tiled: true` when a dataset is an
# external mosaic (a prefix/folder of many .tif tiles) rather than a single .tif.
# Output these with OUTPUT_FORMAT = "tif".
topography:
  cop_dem:
    path: static_layers/cop_dem
    container: cogs
    format: cog
    tiled: true
    anon: true
    display_name: Copernicus DEM
    description: Copernicus digital elevation model (tiled mosaic)
    variable: elevation
    temporal: false
    crs: EPSG:4326

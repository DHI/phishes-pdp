# Partner / externally-shared open data catalog.
#
# Datasets delivered by partners as zip bundles in the public
# "external-shared-open-data" Azure container. Contents are mixed/arbitrary
# (shapefiles, CSVs, Word metadata), so these bypass the raster/vector pipelines
# entirely: the .zip blob is downloaded whole and as-is (no extraction, no
# catchment clipping). Kept separate from dataset_catalog.yaml (Zarr), cog_catalog.yaml
# (COG), and geoparquet_catalog.yaml (vector); the downloader loads and merges all four
# per-category into one namespace for download_dataset(category, subcategory).
#
# Partner-specific fields:
#   format: zip        -> routes the entry to the zip (whole-blob copy) path
#   container: external-shared-open-data -> Azure container holding the .zip files
#   anon: true         -> read the container with anonymous (public) access
#   temporal: false    -> static bundle; temporal subsetting is skipped
# OUTPUT_FORMAT is ignored for zip entries; the .zip is delivered verbatim.

partner:
  czech_globe_ms4:
    path: "MS4-CG data for PDP.zip"
    container: external-shared-open-data
    format: zip
    anon: true
    display_name: Czech Globe MS4 data (zip)
    description: Czech Globe MS4 partner bundle - Koprzywianka & Zelivka basin shapefiles (EPSG:3035) plus metadata.
    variable: partner_bundle
    temporal: false

  copenhagen_university_ms4:
    path: "MS4-KU data for PDP.zip"
    container: external-shared-open-data
    format: zip
    anon: true
    display_name: Copenhagen University MS4 data (zip)
    description: Copenhagen University MS4 partner bundle - shapefile plus 30-year annual precipitation/evaporation/percolation CSVs and metadata.
    variable: partner_bundle
    temporal: false

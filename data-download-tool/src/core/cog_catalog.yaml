# Cloud Optimized GeoTIFF (COG) catalog.
#
# Static raster layers (no time dimension) stored as COGs in the public "cogs"
# Azure container. Kept separate from dataset_catalog.yaml (Zarr time series) to
# keep each file focused; the downloader loads and merges both.
#
# COG-specific fields:
#   format: cog        -> routes the entry to the COG reader
#   container: cogs    -> Azure container holding the COGs
#   tiled: true|false  -> true: `path` is a prefix/folder of many tiles (mosaicked
#                         to the catchment); false: `path` is a single .tif
#   anon: true         -> read the container with anonymous (public) access
#   temporal: false    -> static layer; temporal subsetting is skipped
# Download these with OUTPUT_FORMAT = "tif".

landcover:
  esa_worldcover_2021:
    path: static_layers/esa_worldcover_europe_2021_v200
    container: cogs
    format: cog
    tiled: true
    anon: true
    display_name: ESA WorldCover Europe 2021 (v200)
    description: ESA WorldCover Europe 2021 v200 (tiled mosaic, ~10 m)
    variable: landcover
    temporal: false
    crs: EPSG:4326

topography:
  cop_dem:
    path: static_layers/cop_dem
    container: cogs
    format: cog
    tiled: true
    anon: true
    display_name: Copernicus DEM
    description: Copernicus digital elevation model (tiled mosaic)
    variable: elevation
    temporal: false
    crs: EPSG:4326


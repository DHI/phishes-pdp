# Dependabot configuration.
#
# Version updates are DISABLED for both pip ecosystems (`open-pull-requests-limit: 0`).
# This is deliberate, for two reasons:
#
#   1. Nearly every dependency in both modules is declared as a `>=` floor, not a pin.
#      `uv sync` already resolves the newest compatible release, so a PR raising a floor
#      changes nothing about what actually gets installed — it is pure branch churn.
#   2. The one real pin, `ruff==`, must move in three places at once (both
#      `pyproject.toml` files and the `rev` in `.pre-commit-config.yaml` — see the CI
#      contract in CLAUDE.md). Dependabot edits one file and leaves the others behind,
#      producing a PR that cannot be merged as-is and silently drifts the pin.
#
# Security coverage does not depend on this file: `pip-audit` runs as a blocking check on
# every pull request (.github/workflows/security.yml), and Dependabot *security* updates
# are enabled at the repository level, so vulnerability fixes still arrive as PRs.
#
# Bump dependencies deliberately instead: edit the `pyproject.toml`, re-run
# `uv sync --link-mode copy`, and bump all three ruff locations together.
#
# GitHub Actions updates are kept — action pins are single-file edits with no
# cross-file invariant — but grouped into one monthly pull request instead of one
# branch per action.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/model-trains/MSHE-Ecolab-PGM"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    # 0 disables version-update pull requests; security updates are unaffected.
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/data-download-tool"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    # 0 disables version-update pull requests; security updates are unaffected.
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

name: Security

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: .
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - model-trains/MSHE-Ecolab
          - data-download-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Install project (if pyproject exists)
        if: ${{ hashFiles(format('{0}/pyproject.toml', matrix.dir)) != '' }}
        run: |
          pip install -e "${{ matrix.dir }}"

      # --skip-editable is required, not cosmetic. Without it pip-audit tries to
      # look up the module we just installed with `pip install -e` on PyPI,
      # where it does not exist, and exits non-zero every single run:
      #   "phishes-data-downloader ... not found on PyPI and could not be
      #    audited". The job could never pass, so it carried no signal.
      - name: pip-audit
        run: |
          pip-audit --skip-editable

      - name: Bandit
        run: |
          cd "${{ matrix.dir }}"
          bandit -r src

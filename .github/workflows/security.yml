name: Security

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: .
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - model-trains/MSHE-Ecolab-PGM
          - data-download-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # Audit the module's own uv environment, resolved from pyproject.toml.
      #
      # Two things were wrong with auditing the ambient runner environment
      # instead. It exited non-zero on every run because pip-audit looked up the
      # just-installed local module on PyPI and could not find it
      # ("phishes-data-downloader ... could not be audited") — so the job never
      # carried any signal. And it reported CVEs in whatever setuptools the
      # runner image happened to ship, which is not a dependency of either
      # module. A uv environment seeds no pip/setuptools/wheel, so what is left
      # is exactly the project's own dependency closure.
      #
      # --no-dev scopes this to the runtime closure. The dev group pulls the
      # jupyter and streamlit stacks, whose deep transitive CVEs are local
      # tooling rather than deployed surface and are not this repository's to
      # fix. Blocking a merge on them would mean blocking on jupyter's
      # dependency tree.
      - name: Install runtime dependencies
        working-directory: ${{ matrix.dir }}
        run: uv sync --no-dev

      - name: pip-audit
        working-directory: ${{ matrix.dir }}
        run: uv run --no-dev --with pip-audit pip-audit --skip-editable

      - name: Bandit
        working-directory: ${{ matrix.dir }}
        run: uv run --with bandit bandit -r src

# Local equivalent of the blocking CI checks. Run `pip install pre-commit &&
# pre-commit install` once, and formatting/whitespace issues get fixed before
# they ever reach a pull request.
#
# This matters most for fork contributors: a pull request from a fork runs with
# a read-only token, so nothing in CI can fix their branch for them. These
# hooks are the only automatic fixer they get.
#
# Versions are pinned deliberately. The `ruff` rev here must match the `ruff==`
# pin in data-download-tool/pyproject.toml and
# model-trains/MSHE-Ecolab-PGM/pyproject.toml so local and CI results cannot
# diverge. Bump all three together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        # model-trains/HYDRUS-PHREEQC-MODFLOW2005-MT3D/ is delivered by BRGM and
        # kept byte-for-byte as received, so no hook may rewrite it — `--fix`
        # least of all, since it deletes unused imports. It is also outside CI:
        # the matrices in .github/workflows/{ci,security}.yml list modules
        # explicitly and do not include this folder, so linting it here would
        # block commits on findings no pull request check ever reports.
        # Drop these exclusions only if the folder stops being vendor-owned.
        exclude: ^model-trains/HYDRUS-PHREEQC-MODFLOW2005-MT3D/
      - id: ruff-format
        exclude: ^model-trains/HYDRUS-PHREEQC-MODFLOW2005-MT3D/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fixes the MD009 and MD047 findings Markdown Lint reports.
      - id: trailing-whitespace
        # sample_data holds MIKE SHE PreProcessor output parsed by fixed column
        # position; notebook JSON is already handled by the ruff hooks. The
        # BRGM-delivered train is excluded wholesale — its content is not ours to
        # rewrite, and its HYDRUS-1D project files (ATMOSPH.IN, PROFILE.DAT,
        # SELECTOR.IN, …) are fixed-format, so stripping trailing whitespace
        # would corrupt them.
        exclude: (^|/)sample_data/|\.ipynb$|^model-trains/HYDRUS-PHREEQC-MODFLOW2005-MT3D/
      - id: end-of-file-fixer
        exclude: (^|/)sample_data/|\.ipynb$|^model-trains/HYDRUS-PHREEQC-MODFLOW2005-MT3D/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Matches the 10 MB ceiling enforced by the File Size Check job.
        args: [--maxkb=10240]

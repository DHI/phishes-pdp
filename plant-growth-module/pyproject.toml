[project]
name = "plant-growth-module"
version = "0.1.0"
description = "Plant Growth Module (PGM) for MIKE SHE Integration. Use 'uv sync --link-mode copy' on OneDrive."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=1.24.0",
    "mikeio>=1.6.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.30.0",
    "ipywidgets>=8.0.0",
    "phishes-data-downloader @ git+https://github.com/DHI/phishes-pdp.git@main#subdirectory=data-download-tool",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_growth_module"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.pip]
link-mode = "copy"

[tool.coverage.run]
source = ["src/plant_growth_module"]

[tool.coverage.report]
show_missing = true
skip_covered = false
